name: Deploy to InfinityFree

on:
  push:
    branches:
      - main   # Agar aapka main branch ka naam 'master' hai toh yahan 'master' karein

jobs:
  web-deploy:
    name: Deploy Website
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Sync files to InfinityFree
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          server-dir: htdocs/   # Code htdocs folder ke andar jayega